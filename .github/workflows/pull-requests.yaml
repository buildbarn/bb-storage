{
   "jobs": {
      "integration_test": {
         "name": "integration_test x1000",
         "runs-on": "ubuntu-latest",
         "timeout-minutes": 350,
         "steps": [
            {
               "name": "Check out source code",
               "uses": "actions/checkout@v1"
            },
            {
               "name": "Installing Bazel",
               "run": "v=$(cat .bazelversion) && curl -L https://github.com/bazelbuild/bazel/releases/download/${v}/bazel-${v}-linux-x86_64 > ~/bazel && chmod +x ~/bazel && echo ~ >> ${GITHUB_PATH}",
               "shell": "bash"
            },
            {
               "name": "Run integration test 1000 times",
               "run": "bazel test --test_output=errors --runs_per_test=1000 --platforms=@com_github_buildbarn_bb_storage//tools/platforms:linux_amd64 //pkg/blobstore/grpcservers/integration:integration_test"
            }
         ]
      }
   },
   "name": "pull-requests",
   "on": {
      "pull_request": {
         "branches": [
            "main"
         ]
      }
   }
}
